name: Generate Snake Animation 🐍

on:
  schedule:
    - cron: "0 */12 * * *"   # обновление каждые 12 часов
  workflow_dispatch:         # запуск вручную из Actions
  push:
    branches: [ main ]       # на всякий случай — при пуше в main

permissions:
  contents: write            # нужно, чтобы пушить в ветку output

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Генерируем сразу 2 SVG: тёмную и светлую
      - name: Generate Snake (mono dark & light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ahmad2391778
          outputs: |
            dist/snake-dark.svg
            dist/snake-light.svg
          # монохромные цвета
          color_snake: "#e6e6e6"
          color_head:  "#ffffff"
          color_dots:  "#0d1117"
          color_empty: "#ffffff10"
          background:  "#0d1117"

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
